name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      AUTH_SECRET: ci-secret-test-auth-key-at-least-32-chars-long
      DEMO_PASSWORD: ci-test-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Ensure databases exist
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE test;" || psql -h localhost -U postgres -d test -c "CREATE DATABASE postgres;" || true
        env:
          PGPASSWORD: postgres
      - run: npm run db:migrate
      - run: npm run db:migrate:test
      - run: npm run db:seed:users:test
      - run: npm test
      - run: npm audit --audit-level=high
